<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F2F0EB">
<title>Wedding Photo Frame</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Zen+Old+Mincho:wght@400;700&display=swap">
<style>
/* Layout: one narrow column — design + size switches, live canvas preview, then the actions a guest needs. */
:root {
  --bg: #F2F0EB;
  --surface: #FBFAF7;
  --fg: #2B2E2A;
  --muted: #6E726A;
  --line: #D9D6CD;
  --accent: #5E7458;
  --accent-fg: #FFFFFF;
  --font-display: "Cormorant Garamond", "Times New Roman", serif;
  --font-body: "Zen Old Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1B1D1A; --surface: #242722; --fg: #ECEAE3; --muted: #A3A69C;
    --line: #3A3E37; --accent: #9DB592; --accent-fg: #172015; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1B1D1A; --surface: #242722; --fg: #ECEAE3; --muted: #A3A69C;
  --line: #3A3E37; --accent: #9DB592; --accent-fg: #172015; color-scheme: dark;
}
html, body { background: var(--bg); color: var(--fg); }
body {
  font-family: var(--font-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 24px 40px;
}
.wrap { max-width: 460px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
header { text-align: center; display: flex; flex-direction: column; gap: 4px; margin-bottom: 4px; }
.eyebrow { font-family: var(--font-display); font-style: italic; font-size: 15px; color: var(--muted); letter-spacing: .06em; }
h1 { margin: 0; font-size: 21px; font-weight: 700; letter-spacing: .06em; text-wrap: balance; }
.lead { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.7; }

.switch { display: flex; flex-direction: column; gap: 6px; }
.switch-label { font-size: 11px; letter-spacing: .12em; color: var(--muted); }
.tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.tab {
  font: inherit; font-size: 14px; padding: 10px 8px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--surface); color: var(--fg); cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 8px;
}
.tab small { font-family: var(--font-display); font-size: 13px; color: var(--muted); }
.tab[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); font-weight: 700; }
.tab[aria-pressed="true"] small { color: var(--accent); }

.stage { display: flex; flex-direction: column; align-items: center; margin-top: 6px; }
canvas#preview {
  display: block; max-width: 100%; height: auto;
  width: min(100%, calc(66vh * var(--arw, .8)));
  border-radius: 6px; box-shadow: 0 10px 30px rgba(0,0,0,.14);
  touch-action: none; cursor: grab;
}
.hint { margin: 8px 0 0; text-align: center; font-size: 12px; color: var(--muted); min-height: 1.4em; }

.zoom { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); }
.zoom input { flex: 1; accent-color: var(--accent); }

.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.btn {
  font: inherit; font-size: 15px; padding: 14px 10px; border-radius: 10px; cursor: pointer;
  border: 1px solid var(--line); background: var(--surface); color: var(--fg);
  display: flex; align-items: center; justify-content: center; text-align: center;
}
.btn.primary { grid-column: 1 / -1; background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: 700; }
.btn:disabled { opacity: .45; cursor: default; }
.btn:focus-visible, .tab:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
input[type=file] { display: none; }

.result { display: flex; flex-direction: column; gap: 8px; text-align: center; align-items: center; }
.result img { width: min(100%, 360px); border-radius: 6px; }
.result p { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.6; }
.toast { text-align: center; font-size: 13px; color: var(--accent); min-height: 1.4em; margin: 0; }
footer { text-align: center; font-family: var(--font-display); font-style: italic; font-size: 14px; color: var(--muted); }
</style>

<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0;-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="eyebrow" id="eyebrow">SOTA &amp; MANAMI · 2026.10.31 SAT</span>
    <h1>フォトフレーム</h1>
    <p class="lead">写真を撮るとフレームにはまります。保存してSNSに投稿してね。</p>
  </header>

  <div class="switch">
    <span class="switch-label">デザイン</span>
    <div class="tabs" role="group" aria-label="デザインを選ぶ">
      <button class="tab" id="tab-garden" aria-pressed="true">Garden</button>
      <button class="tab" id="tab-film" aria-pressed="false">Film</button>
    </div>
  </div>

  <div class="switch">
    <span class="switch-label">サイズ</span>
    <div class="tabs" role="group" aria-label="サイズを選ぶ">
      <button class="tab" id="size-post" aria-pressed="true">投稿 <small>4:5</small></button>
      <button class="tab" id="size-story" aria-pressed="false">ストーリー <small>9:16</small></button>
    </div>
  </div>

  <div class="stage">
    <canvas id="preview" width="1080" height="1350" aria-label="フレームのプレビュー"></canvas>
    <p class="hint" id="hint">まずは下のボタンから写真を撮ってください</p>
  </div>

  <label class="zoom" for="zoom" id="zoomRow" hidden>
    <span>ズーム</span>
    <input type="range" id="zoom" min="1" max="3" step="0.01" value="1">
  </label>

  <div class="actions">
    <button class="btn" id="btnCamera">カメラで撮る</button>
    <button class="btn" id="btnLibrary">写真を選ぶ</button>
    <button class="btn primary" id="btnSave" disabled>この写真を保存</button>
  </div>
  <input type="file" id="fileCamera" accept="image/*" capture="environment">
  <input type="file" id="fileLibrary" accept="image/*">
  <p class="toast" id="toast" role="status"></p>

  <div class="result" id="result" hidden>
    <img id="resultImg" alt="フレーム付きの写真">
    <p>画像を長押しして「写真に保存」できます</p>
  </div>

  <footer>Thank you for celebrating with us</footer>
</div>

<script>
// ===== 文字情報（仮デザイン用） =====
const CONFIG = {
  names: "Sota & Manami",
  date: "2026.10.31",
  day: "SAT",
  dateStamp: "'26 10 31"
};

// ===== スミレさんのPNGテンプレート（写真部分を透明にしたもの） =====
// ここに画像（data URI）が入ると、仮デザインの代わりにそれが使われます。
const TEMPLATES = {
  garden: { post: null, story: null },
  film:   { post: null, story: null }
};
// ==================================================================

const SIZES = { post: { w: 1080, h: 1350 }, story: { w: 1080, h: 1920 } };
const cv = document.getElementById("preview");
const ctx = cv.getContext("2d");
let design = "garden", size = "post";
let W = 1080, H = 1350;
let photo = null;
let zoom = 1, panX = 0, panY = 0;
const templateImgs = {};

document.getElementById("eyebrow").textContent =
  CONFIG.names.toUpperCase() + " · " + CONFIG.date + " " + CONFIG.day;

// ---------- Placeholder designs ----------
const DESIGNS = {
  garden: {
    slots: {
      post:  { x: 150, y: 150, w: 780, h: 900 },
      story: { x: 150, y: 330, w: 780, h: 1010 }
    },
    text: { post: [1192, 1262], story: [1486, 1560] },
    bg(c) {
      c.fillStyle = "#F4F2EC"; c.fillRect(0, 0, W, H);
      c.save(); c.globalAlpha = .035;
      for (let i = 0; i < 2600; i++) {
        c.fillStyle = i % 2 ? "#000" : "#8a7f6a";
        c.fillRect((i * 997) % W, (i * 619) % H, 2, 2);
      }
      c.restore();
    },
    clip(c, s) {
      const r = s.w / 2;
      c.beginPath();
      c.moveTo(s.x, s.y + s.h);
      c.lineTo(s.x, s.y + r);
      c.arc(s.x + r, s.y + r, r, Math.PI, 0);
      c.lineTo(s.x + s.w, s.y + s.h);
      c.closePath();
    },
    overlay(c, s) {
      c.save();
      c.strokeStyle = "#7E8F76"; c.lineWidth = 2;
      const o = 18, r = s.w / 2 + o;
      c.beginPath();
      c.moveTo(s.x - o, s.y + s.h + o);
      c.lineTo(s.x - o, s.y + s.w / 2);
      c.arc(s.x + s.w / 2, s.y + s.w / 2, r, Math.PI, 0);
      c.lineTo(s.x + s.w + o, s.y + s.h + o);
      c.closePath(); c.stroke();
      c.restore();
      sprig(c, s.x - 10, s.y + s.h + 20, -2.2, 1);
      sprig(c, s.x + s.w + 10, s.y + s.h + 20, -0.95, -1);
      sprig(c, s.x + s.w / 2, s.y - 40, -Math.PI / 2, 1, .55);
      const [ny, dy] = this.text[size];
      c.textAlign = "center"; c.fillStyle = "#2F3A2C";
      c.font = '100px "Pinyon Script"';
      c.fillText(CONFIG.names, W / 2, ny);
      c.font = '500 32px "Cormorant Garamond"';
      spaced(c, CONFIG.date + "   ·   " + CONFIG.day, W / 2, dy, 8, "#5E7458");
    },
    empty: { bg: "#E3E5DC", fg: "#5E7458" }
  },
  film: {
    slots: {
      post:  { x: 80, y: 80, w: 920, h: 1040 },
      story: { x: 80, y: 300, w: 920, h: 1180 }
    },
    text: { post: 1268, story: 1630 },
    bg(c) { c.fillStyle = "#1F2A38"; c.fillRect(0, 0, W, H); },
    clip(c, s) { c.beginPath(); c.rect(s.x, s.y, s.w, s.h); },
    overlay(c, s) {
      c.save();
      c.font = '700 44px "Courier New", monospace';
      c.textAlign = "right";
      c.shadowColor = "rgba(255,120,30,.9)"; c.shadowBlur = 14;
      c.fillStyle = "#FF8A2B";
      c.fillText(CONFIG.dateStamp, s.x + s.w - 36, s.y + s.h - 36);
      c.restore();
      c.save();
      c.font = '500 22px "Courier New", monospace';
      spaced(c, "KODAK 400   ▸ 24", s.x, s.y + s.h + 44, 3, "#8C97A6", "left");
      c.fillStyle = "#8C97A6"; c.textAlign = "right";
      c.fillText(CONFIG.date + " " + CONFIG.day, s.x + s.w, s.y + s.h + 44);
      c.restore();
      c.textAlign = "center"; c.fillStyle = "#E9D9B8";
      c.font = 'italic 500 84px "Cormorant Garamond"';
      c.fillText(CONFIG.names, W / 2, this.text[size]);
    },
    empty: { bg: "#2C3A4C", fg: "#B9C3D0" }
  }
};

function spaced(c, text, x, y, sp, color, align = "center") {
  c.save(); c.fillStyle = color;
  const chars = [...text];
  const widths = chars.map(ch => c.measureText(ch).width);
  const total = widths.reduce((a, b) => a + b, 0) + sp * (chars.length - 1);
  let cx = align === "center" ? x - total / 2 : x;
  c.textAlign = "left";
  chars.forEach((ch, i) => { c.fillText(ch, cx, y); cx += widths[i] + sp; });
  c.restore();
}

function sprig(c, x, y, angle, dir, scale = 1) {
  c.save();
  c.translate(x, y); c.rotate(angle); c.scale(scale, scale * dir);
  c.strokeStyle = "#6F8566"; c.fillStyle = "#8FA285"; c.lineWidth = 3; c.lineCap = "round";
  c.beginPath(); c.moveTo(0, 0); c.quadraticCurveTo(70, -14, 150, 0); c.stroke();
  for (let i = 0; i < 6; i++) {
    const t = 22 + i * 22, side = i % 2 ? 1 : -1;
    c.save();
    c.translate(t, -t * .09);
    c.rotate(side * 0.75);
    c.beginPath(); c.ellipse(0, side * -16, 8, 17, 0, 0, Math.PI * 2);
    c.globalAlpha = .85 - i * .06; c.fill();
    c.restore();
  }
  c.fillStyle = "#C9B98F";
  c.beginPath(); c.arc(156, 0, 6, 0, Math.PI * 2); c.fill();
  c.restore();
}

// ---------- Render ----------
function drawPhoto(c, s) {
  const pw = photo.width, ph = photo.height;
  const sc = Math.max(s.w / pw, s.h / ph) * zoom;
  const dw = pw * sc, dh = ph * sc;
  const mx = Math.max(0, (dw - s.w) / 2), my = Math.max(0, (dh - s.h) / 2);
  panX = Math.min(mx, Math.max(-mx, panX));
  panY = Math.min(my, Math.max(-my, panY));
  c.drawImage(photo, s.x + (s.w - dw) / 2 + panX, s.y + (s.h - dh) / 2 + panY, dw, dh);
}

function render(c = ctx) {
  c.clearRect(0, 0, W, H);
  const tpl = templateImgs[design + "_" + size];
  if (tpl) {
    // user's PNG: photo fills the whole canvas underneath, PNG on top
    const full = { x: 0, y: 0, w: W, h: H };
    if (photo) drawPhoto(c, full);
    else { c.fillStyle = "#D8D8D3"; c.fillRect(0, 0, W, H); }
    c.drawImage(tpl, 0, 0, W, H);
    return;
  }
  const d = DESIGNS[design], s = d.slots[size];
  d.bg(c);
  c.save();
  d.clip(c, s); c.clip();
  if (photo) drawPhoto(c, s);
  else {
    c.fillStyle = d.empty.bg; c.fillRect(s.x, s.y, s.w, s.h);
    c.fillStyle = d.empty.fg; c.textAlign = "center";
    c.font = 'italic 500 34px "Cormorant Garamond"';
    c.fillText("your photo here", s.x + s.w / 2, s.y + s.h / 2 - 34);
    c.font = '700 44px "Zen Old Mincho"';
    c.fillText("ここに写真が入ります", s.x + s.w / 2, s.y + s.h / 2 + 30);
  }
  c.restore();
  d.overlay(c, s);
}

// ---------- Switches ----------
function press(ids, active) {
  ids.forEach(id => document.getElementById(id).setAttribute("aria-pressed", id === active));
}
function setDesign(name) {
  design = name; press(["tab-garden", "tab-film"], "tab-" + name);
  panX = panY = 0; hideResult(); render();
}
function setSize(name) {
  size = name; press(["size-post", "size-story"], "size-" + name);
  W = SIZES[name].w; H = SIZES[name].h;
  cv.width = W; cv.height = H;
  cv.style.setProperty("--arw", (W / H).toFixed(4));
  panX = panY = 0; hideResult(); render();
}
document.getElementById("tab-garden").onclick = () => setDesign("garden");
document.getElementById("tab-film").onclick = () => setDesign("film");
document.getElementById("size-post").onclick = () => setSize("post");
document.getElementById("size-story").onclick = () => setSize("story");

// ---------- Photo input ----------
const hint = document.getElementById("hint");
document.getElementById("btnCamera").onclick = () => document.getElementById("fileCamera").click();
document.getElementById("btnLibrary").onclick = () => document.getElementById("fileLibrary").click();
["fileCamera", "fileLibrary"].forEach(id => {
  document.getElementById(id).addEventListener("change", async e => {
    const f = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!f) return;
    try {
      photo = await loadImage(f);
      zoom = 1; panX = panY = 0;
      document.getElementById("zoom").value = 1;
      document.getElementById("zoomRow").hidden = false;
      document.getElementById("btnSave").disabled = false;
      hint.textContent = "ドラッグで位置、スライダーでズームを調整できます";
      hideResult(); render();
    } catch {
      hint.textContent = "写真を読み込めませんでした。別の写真で試してください";
    }
  });
});

async function loadImage(src) {
  if (src instanceof Blob && "createImageBitmap" in window) {
    try { return await createImageBitmap(src, { imageOrientation: "from-image" }); } catch {}
  }
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => res(img);
    img.onerror = rej;
    img.src = src instanceof Blob ? URL.createObjectURL(src) : src;
  });
}

document.getElementById("zoom").addEventListener("input", e => { zoom = +e.target.value; hideResult(); render(); });

// ---------- Drag / pinch ----------
const pointers = new Map();
let lastDist = 0;
const toCanvas = dx => dx * (W / cv.getBoundingClientRect().width);
cv.addEventListener("pointerdown", e => {
  if (!photo) return;
  cv.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
});
cv.addEventListener("pointermove", e => {
  if (!pointers.has(e.pointerId)) return;
  const prev = pointers.get(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    const dist = Math.hypot(a.x - b.x, a.y - b.y);
    if (lastDist) {
      zoom = Math.min(3, Math.max(1, zoom * dist / lastDist));
      document.getElementById("zoom").value = zoom;
    }
    lastDist = dist;
  } else {
    panX += toCanvas(e.clientX - prev.x);
    panY += toCanvas(e.clientY - prev.y);
  }
  hideResult(); render();
});
["pointerup", "pointercancel"].forEach(t => cv.addEventListener(t, e => {
  pointers.delete(e.pointerId); lastDist = 0;
}));

// ---------- Save ----------
const toast = document.getElementById("toast");
function hideResult() { document.getElementById("result").hidden = true; toast.textContent = ""; }

document.getElementById("btnSave").onclick = async () => {
  if (!photo) return;
  const out = document.createElement("canvas");
  out.width = W; out.height = H;
  render(out.getContext("2d"));
  const blob = await new Promise(r => out.toBlob(r, "image/jpeg", 0.92));
  const filename = "sota_manami_" + design + "_" + size + "_" + Date.now() + ".jpg";
  const file = new File([blob], filename, { type: "image/jpeg" });

  const img = document.getElementById("resultImg");
  img.src = URL.createObjectURL(blob);
  document.getElementById("result").hidden = false;

  // phones: open the share sheet ("画像を保存" / Instagram etc.)
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try {
      await navigator.share({ files: [file] });
      toast.textContent = "保存・共有できました";
      return;
    } catch (err) {
      if (err && err.name === "AbortError") {
        toast.textContent = "下の画像を長押しでも保存できます";
        return;
      }
    }
  }
  // PCなど: そのままダウンロード
  const a = document.createElement("a");
  a.href = img.src; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  toast.textContent = "保存しました。うまくいかないときは下の画像を長押ししてください";
  img.scrollIntoView({ behavior: "smooth", block: "center" });
};

// ---------- Boot ----------
(async () => {
  for (const d of Object.keys(TEMPLATES)) for (const s of Object.keys(TEMPLATES[d])) {
    if (TEMPLATES[d][s]) {
      try { templateImgs[d + "_" + s] = await loadImage(TEMPLATES[d][s]); } catch {}
    }
  }
  render();
})();
render();
Promise.all([
  document.fonts.load('100px "Pinyon Script"'),
  document.fonts.load('500 32px "Cormorant Garamond"'),
  document.fonts.load('italic 500 34px "Cormorant Garamond"'),
  document.fonts.load('700 44px "Zen Old Mincho"')
]).then(() => render()).catch(() => {});
</script>

</body>
</html>
