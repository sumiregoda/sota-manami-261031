<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F2F0EB">
<title>Wedding Photo Frame</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Zen+Old+Mincho:wght@400;700&display=swap">
<style>
*,*::before,*::after { box-sizing: border-box; }
[hidden] { display: none !important; }
/* Layout: one narrow column — design + size switches, live canvas preview, then the actions a guest needs. */
:root {
  --bg: #F2F0EB;
  --surface: #FBFAF7;
  --fg: #2B2E2A;
  --muted: #6E726A;
  --line: #D9D6CD;
  --accent: #5E7458;
  --accent-fg: #FFFFFF;
  --font-display: "Cormorant Garamond", "Times New Roman", serif;
  --font-body: "Zen Old Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1B1D1A; --surface: #242722; --fg: #ECEAE3; --muted: #A3A69C;
    --line: #3A3E37; --accent: #9DB592; --accent-fg: #172015; color-scheme: dark;
  }
}
html, body { background: var(--bg); color: var(--fg); }
body {
  margin: 0;
  -webkit-text-size-adjust: 100%;
  font-family: var(--font-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 24px 40px;
}
.wrap { max-width: 460px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
header { text-align: center; display: flex; flex-direction: column; gap: 4px; margin-bottom: 4px; }
.eyebrow { font-family: var(--font-display); font-style: italic; font-size: 15px; color: var(--muted); letter-spacing: .06em; }
h1 { margin: 0; font-size: 21px; font-weight: 700; letter-spacing: .06em; text-wrap: balance; }
.lead { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.7; }

.switch { display: flex; flex-direction: column; gap: 6px; }
.switch-label { font-size: 11px; letter-spacing: .12em; color: var(--muted); }
.tabs { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 8px; }
.tab {
  font: inherit; font-size: 14px; padding: 10px 6px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--surface); color: var(--fg); cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 6px; min-width: 0;
}
.tab small { font-family: var(--font-display); font-size: 13px; color: var(--muted); }
.tab[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); font-weight: 700; }
.tab[aria-pressed="true"] small { color: var(--accent); }
.tab:disabled { opacity: .35; cursor: default; }

.stage { display: flex; flex-direction: column; align-items: center; margin-top: 6px; }
canvas#preview {
  display: block; max-width: 100%; height: auto;
  width: min(100%, calc(66vh * var(--arw, .8)));
  border-radius: 6px; box-shadow: 0 10px 30px rgba(0,0,0,.14);
  touch-action: none; cursor: grab;
}
.hint { margin: 8px 0 0; text-align: center; font-size: 12px; color: var(--muted); min-height: 1.4em; }

.zoom { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); }
.zoom input { flex: 1; accent-color: var(--accent); }

.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.btn {
  font: inherit; font-size: 15px; padding: 14px 10px; border-radius: 10px; cursor: pointer;
  border: 1px solid var(--line); background: var(--surface); color: var(--fg);
  display: flex; align-items: center; justify-content: center; text-align: center;
}
.btn.primary { grid-column: 1 / -1; background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: 700; }
.btn:disabled { opacity: .45; cursor: default; }
.btn:focus-visible, .tab:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
input[type=file] { display: none; }

.result { display: flex; flex-direction: column; gap: 8px; text-align: center; align-items: center; }
.result img { width: min(100%, 360px); border-radius: 6px; }
.result p { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.6; }
.toast { text-align: center; font-size: 13px; color: var(--accent); min-height: 1.4em; margin: 0; }
footer { text-align: center; font-family: var(--font-display); font-style: italic; font-size: 14px; color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="eyebrow">SOTA &amp; MANAMI · 31 OCTOBER 2026</span>
    <h1>フォトフレーム</h1>
    <p class="lead">写真を撮るとフレームにはまります。保存してSNSに投稿してね。</p>
  </header>

  <div class="switch">
    <span class="switch-label">デザイン</span>
    <div class="tabs" id="designTabs" role="group" aria-label="デザインを選ぶ"></div>
  </div>

  <div class="switch">
    <span class="switch-label">サイズ</span>
    <div class="tabs" role="group" aria-label="サイズを選ぶ">
      <button class="tab" id="size-post" aria-pressed="false">投稿 <small>4:5</small></button>
      <button class="tab" id="size-story" aria-pressed="false">ストーリー <small>9:16</small></button>
    </div>
  </div>

  <div class="stage">
    <canvas id="preview" width="1080" height="1350" aria-label="フレームのプレビュー"></canvas>
    <p class="hint" id="hint">フレームを読み込んでいます…</p>
  </div>

  <label class="zoom" for="zoom" id="zoomRow" hidden>
    <span>ズーム</span>
    <input type="range" id="zoom" min="1" max="3" step="0.01" value="1">
  </label>

  <div class="actions">
    <button class="btn" id="btnCamera">カメラで撮る</button>
    <button class="btn" id="btnLibrary">写真を選ぶ</button>
    <button class="btn primary" id="btnSave" disabled>この写真を保存</button>
  </div>
  <input type="file" id="fileCamera" accept="image/*" capture="environment">
  <input type="file" id="fileLibrary" accept="image/*">
  <p class="toast" id="toast" role="status"></p>

  <div class="result" id="result" hidden>
    <img id="resultImg" alt="フレーム付きの写真">
    <p>画像を長押しして「写真に保存」できます</p>
  </div>

  <footer>Thank you for celebrating with us</footer>
</div>

<script>
// ================= フレームの設定 =================
// ボタンはこの順番で並びます。
// 画像は index.html と同じ場所に「file名_01.png（投稿用）」「file名_02.png（ストーリー用）」でアップしてください。
// 画像が1枚もないデザインのボタンは自動で隠れます。片方のサイズしかない場合は、そのサイズだけ選べます。
const DESIGNS = [
  { file: "collage", label: "Collage" },
  { file: "animal",  label: "Animal" },
  { file: "heart",   label: "Heart" },
  { file: "design4", label: "Design 4" }   // 名前が決まったら label を変えてください
];
// ==================================================

const SIZES = {
  post:  { w: 1080, h: 1350, suffix: "_01" },
  story: { w: 1080, h: 1920, suffix: "_02" }
};

const cv = document.getElementById("preview");
const ctx = cv.getContext("2d");
const hint = document.getElementById("hint");
const toast = document.getElementById("toast");
let design = null, size = "post";
let W = 1080, H = 1350;
let photo = null;
let zoom = 1, panX = 0, panY = 0;
const frames = {};   // frames["heart"]["story"] = image

// ---------- Loading frames ----------
function loadImage(src) {
  if (src instanceof Blob && "createImageBitmap" in window) {
    return createImageBitmap(src, { imageOrientation: "from-image" }).catch(() => loadViaImg(src));
  }
  return loadViaImg(src);
}
function loadViaImg(src) {
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => res(img);
    img.onerror = rej;
    img.src = src instanceof Blob ? URL.createObjectURL(src) : src;
  });
}
// tries heart_01.png, Heart_01.png, HEART_01.png (GitHub Pages is case-sensitive)
async function loadFrame(file, suffix) {
  const cap = file.charAt(0).toUpperCase() + file.slice(1);
  const names = [file, cap, file.toUpperCase()].map(n => n + suffix + ".png");
  if (file === "heart" && suffix === "_02") names.push("heart_story.png");
  for (const n of names) {
    try { return await loadViaImg(n); } catch {}
  }
  return null;
}

const availableSizes = d => Object.keys(SIZES).filter(s => frames[d] && frames[d][s]);

// ---------- Render ----------
function drawPhoto(c) {
  const pw = photo.width, ph = photo.height;
  const sc = Math.max(W / pw, H / ph) * zoom;
  const dw = pw * sc, dh = ph * sc;
  const mx = Math.max(0, (dw - W) / 2), my = Math.max(0, (dh - H) / 2);
  panX = Math.min(mx, Math.max(-mx, panX));
  panY = Math.min(my, Math.max(-my, panY));
  c.drawImage(photo, (W - dw) / 2 + panX, (H - dh) / 2 + panY, dw, dh);
}

function render(c = ctx) {
  c.clearRect(0, 0, W, H);
  if (photo) drawPhoto(c);
  else {
    c.fillStyle = "#3A3A3A"; c.fillRect(0, 0, W, H);
    c.fillStyle = "#FFFFFF"; c.textAlign = "center";
    c.font = '700 44px "Zen Old Mincho", serif';
    c.fillText("ここに写真が入ります", W / 2, H * 0.3);
  }
  const f = design && frames[design] && frames[design][size];
  if (f) c.drawImage(f, 0, 0, W, H);
}

// ---------- Switches ----------
function setDesign(file) {
  design = file;
  document.querySelectorAll("#designTabs .tab").forEach(b =>
    b.setAttribute("aria-pressed", b.dataset.file === file));
  const ok = availableSizes(file);
  document.getElementById("size-post").disabled = !ok.includes("post");
  document.getElementById("size-story").disabled = !ok.includes("story");
  applySize(ok.includes(size) ? size : ok[0]);
}
function applySize(name) {
  size = name;
  ["post", "story"].forEach(s =>
    document.getElementById("size-" + s).setAttribute("aria-pressed", s === name));
  W = SIZES[name].w; H = SIZES[name].h;
  cv.width = W; cv.height = H;
  cv.style.setProperty("--arw", (W / H).toFixed(4));
  panX = panY = 0; hideResult(); render();
}
["post", "story"].forEach(s => {
  document.getElementById("size-" + s).onclick = () => {
    if (design && availableSizes(design).includes(s)) applySize(s);
  };
});

// ---------- Photo input ----------
document.getElementById("btnCamera").onclick = () => document.getElementById("fileCamera").click();
document.getElementById("btnLibrary").onclick = () => document.getElementById("fileLibrary").click();
["fileCamera", "fileLibrary"].forEach(id => {
  document.getElementById(id).addEventListener("change", async e => {
    const f = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!f) return;
    try {
      photo = await loadImage(f);
      zoom = 1; panX = panY = 0;
      document.getElementById("zoom").value = 1;
      document.getElementById("zoomRow").hidden = false;
      document.getElementById("btnSave").disabled = false;
      hint.textContent = "ドラッグで位置、スライダーでズームを調整できます";
      hideResult(); render();
    } catch {
      hint.textContent = "写真を読み込めませんでした。別の写真で試してください";
    }
  });
});

document.getElementById("zoom").addEventListener("input", e => { zoom = +e.target.value; hideResult(); render(); });

// ---------- Drag / pinch ----------
const pointers = new Map();
let lastDist = 0;
const toCanvas = dx => dx * (W / cv.getBoundingClientRect().width);
cv.addEventListener("pointerdown", e => {
  if (!photo) return;
  cv.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
});
cv.addEventListener("pointermove", e => {
  if (!pointers.has(e.pointerId)) return;
  const prev = pointers.get(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    const dist = Math.hypot(a.x - b.x, a.y - b.y);
    if (lastDist) {
      zoom = Math.min(3, Math.max(1, zoom * dist / lastDist));
      document.getElementById("zoom").value = zoom;
    }
    lastDist = dist;
  } else {
    panX += toCanvas(e.clientX - prev.x);
    panY += toCanvas(e.clientY - prev.y);
  }
  hideResult(); render();
});
["pointerup", "pointercancel"].forEach(t => cv.addEventListener(t, e => {
  pointers.delete(e.pointerId); lastDist = 0;
}));

// ---------- Save ----------
function hideResult() { document.getElementById("result").hidden = true; toast.textContent = ""; }

document.getElementById("btnSave").onclick = async () => {
  if (!photo) return;
  const out = document.createElement("canvas");
  out.width = W; out.height = H;
  render(out.getContext("2d"));
  const blob = await new Promise(r => out.toBlob(r, "image/jpeg", 0.92));
  const filename = "sota_manami_" + design + "_" + size + "_" + Date.now() + ".jpg";
  const file = new File([blob], filename, { type: "image/jpeg" });

  const img = document.getElementById("resultImg");
  img.src = URL.createObjectURL(blob);
  document.getElementById("result").hidden = false;

  // phones: open the share sheet (画像を保存 / Instagram etc.)
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try {
      await navigator.share({ files: [file] });
      toast.textContent = "保存・共有できました";
      return;
    } catch (err) {
      if (err && err.name === "AbortError") {
        toast.textContent = "下の画像を長押しでも保存できます";
        return;
      }
    }
  }
  // PC etc.: download directly
  const a = document.createElement("a");
  a.href = img.src; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  toast.textContent = "保存しました。うまくいかないときは下の画像を長押ししてください";
  img.scrollIntoView({ behavior: "smooth", block: "center" });
};

// ---------- Boot ----------
applySize("post");
(async () => {
  await Promise.all(DESIGNS.map(async d => {
    frames[d.file] = {};
    await Promise.all(Object.keys(SIZES).map(async s => {
      frames[d.file][s] = await loadFrame(d.file, SIZES[s].suffix);
    }));
  }));
  const tabs = document.getElementById("designTabs");
  const ready = DESIGNS.filter(d => availableSizes(d.file).length);
  ready.forEach(d => {
    const b = document.createElement("button");
    b.className = "tab"; b.dataset.file = d.file; b.textContent = d.label;
    b.setAttribute("aria-pressed", "false");
    b.onclick = () => setDesign(d.file);
    tabs.appendChild(b);
  });
  if (!ready.length) { hint.textContent = "フレームが見つかりませんでした"; return; }
  hint.textContent = "まずは下のボタンから写真を撮ってください";
  setDesign(ready[0].file);
})();
document.fonts && document.fonts.load('700 44px "Zen Old Mincho"').then(() => render()).catch(() => {});
</script>
</body>
</html>
